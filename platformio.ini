[platformio]
src_dir = firmware
default_envs = esp32cam, uno

[env:esp32cam]
platform = espressif32@6.10.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 230400
build_src_filter = +<esp32cam/> -<uno/>
lib_deps = bblanchon/ArduinoJson@6.21.5
; Two 1.9 MB app slots for Wi-Fi updates (tools/ota_esp.py); NVS stays at 0x9000.
board_build.partitions = min_spiffs.csv
build_flags = -D MOTOR_UART=2

[env:esp32cam_uart0]
extends = env:esp32cam
build_flags = -D MOTOR_UART=0

[env:esp32cam_bench]
extends = env:esp32cam_uart0
build_flags = -D MOTOR_UART=0 -D KVIDO_BENCH_DIAG=1

[env:uno]
platform = atmelavr@5.1.0
board = uno
framework = arduino
monitor_speed = 115200
build_src_filter = +<uno/> -<esp32cam/>
lib_deps = arduino-libraries/Servo@1.2.2

; Today's limits of the car (180 PWM / 350 ms / 20 cm) plus camera clearance.
[env:uno_legacy]
extends = env:uno
build_flags = -D KVIDO_MAX_DURATION_MS=350 -D KVIDO_MAX_SPEED=180 -D KVIDO_FORWARD_STOP_CM=20
